# Baseline: mT5-base on clean data only
# google/mt5-base (580M) - multilingual T5, 101 languages including Vietnamese
method: baseline
model_name: google/mt5-base

# Training
batch_size: 8
learning_rate: 3.0e-5
num_epochs: 3
subset_ratio: 1.0  # Use full dataset

# Data
max_input_length: 256
max_output_length: 64
use_noisy_aug: false

# Paths (relative to project root)
data_dir: data/ReceiptVQA-Dataset
output_dir: outputs/models/baseline_mt5
results_file: outputs/results/baseline_mt5_results.csv
log_file: outputs/logs/baseline_mt5.log
