# Baseline: BARTpho on clean data only
# BARTpho-syllable-base (132M) - Vietnamese-specific seq2seq, no word segmentation needed
method: baseline
model_name: vinai/bartpho-syllable-base

# Training
batch_size: 8
learning_rate: 5.0e-5
num_epochs: 3
subset_ratio: 1.0  # Use full dataset

# Data
max_input_length: 256
max_output_length: 64
use_noisy_aug: false

# Paths (relative to project root)
data_dir: data/ReceiptVQA-Dataset
output_dir: outputs/models/baseline_bartpho
results_file: outputs/results/baseline_bartpho_results.csv
log_file: outputs/logs/baseline_bartpho.log
